[project]
name = "routewise-backend"
version = "1.0.0"
description = "Django API for weather-aware truck routing."
authors = [{ name = "Bushra Sajid" }]
requires-python = ">=3.11"
dependencies = [
    "Django>=5.2,<6.1",
    "djangorestframework>=3.15,<4",
    "django-cors-headers>=4.4,<5",
    "requests>=2.32,<3",
    "gunicorn>=23,<24",
    "whitenoise>=6.7,<7",
    "python-dotenv>=1.0,<2",
    "tzdata>=2024.1",
    "redis>=5.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "responses>=0.25",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["staticfiles"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "DJ"]
ignore = ["E501"]

[tool.ruff.format]
# Black-compatible formatting via `ruff format`.
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.test_settings"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:No directory at:UserWarning"]
