[project]
name = "routewise-backend"
version = "1.0.0"
description = "Django API for weather-aware truck routing."
authors = [{ name = "Bushra Sajid" }]
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["staticfiles"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "DJ"]
ignore = ["E501"]

[tool.ruff.format]
# Black-compatible formatting via `ruff format`.
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.test_settings"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:No directory at:UserWarning"]
